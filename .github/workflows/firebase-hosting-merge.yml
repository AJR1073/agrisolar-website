name: Deploy Firebase development site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-agrisolar-website
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify development and production release builds
        run: npm run check:release

      - name: Verify quote attachments and conversion events without sending inquiries
        run: npm run test:form-attachment

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AGRISOLAR_WEBSITE }}
          channelId: live
          projectId: agrisolar-website

      - name: Verify deployed development pages
        run: ./scripts/check-deployment.sh --hosting-only
