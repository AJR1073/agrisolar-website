name: Prepare AgriSolar admin access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify admin access migration is already applied
        run: |
          node scripts/apply-admin-access.cjs
          if ! git diff --quiet; then
            echo "Admin access files are not fully migrated. Review the generated diff before deploying."
            git diff -- database.rules.json storage.rules functions/index.js functions/business-api.js
            exit 1
          fi
          echo "Admin access configuration is ready. Deploy backend changes from an authorized Firebase CLI login."
