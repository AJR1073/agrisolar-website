name: Apply AgriSolar admin access

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply-admin-access.cjs
      - .github/workflows/apply-admin-access.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-admin-access:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply administrator allowlist migration
        run: node scripts/apply-admin-access.cjs

      - name: Install Cloud Functions dependencies
        run: npm ci --prefix functions

      - name: Configure Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AGRISOLAR_WEBSITE }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/agrisolar-firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/agrisolar-firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Ensure Ryan has a Firebase Authentication account
        working-directory: functions
        run: |
          node <<'NODE'
          const admin = require('firebase-admin');
          admin.initializeApp({
            credential: admin.credential.applicationDefault(),
            projectId: 'agrisolar-website'
          });
          const email = 'rfschndr@outlook.com';
          (async () => {
            try {
              const existing = await admin.auth().getUserByEmail(email);
              console.log(`Firebase Auth user already exists: ${existing.uid}`);
            } catch (error) {
              if (error.code !== 'auth/user-not-found') throw error;
              const created = await admin.auth().createUser({
                email,
                displayName: 'R R',
                disabled: false,
                emailVerified: false
              });
              console.log(`Created Firebase Auth user: ${created.uid}`);
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Deploy database, storage, and admin functions
        run: |
          npx --yes firebase-tools@15.30.0 deploy \
            --project agrisolar-website \
            --only database,storage,functions:sendReply,functions:discoverProspects,functions:draftOutreachEmail,functions:apiV1 \
            --non-interactive

      - name: Commit administrator access changes
        run: |
          if git diff --quiet; then
            echo "No repository changes to commit."
            exit 0
          fi
          git config user.name "AgriSolar Admin Access Bot"
          git config user.email "167011114+AJR1073@users.noreply.github.com"
          git add database.rules.json storage.rules functions/index.js functions/business-api.js
          git commit -m "Grant Ryan full admin access"
          git push origin HEAD:main
